<style>
  :root{
    --bg:#FEF6E8;
    --bg-2:#FFFDF6;
    --ink:#1A2421;
    --ink-soft:#46524F;
    --sage:#4A6B47;
    --sage-soft:#C5D6BD;
    --coral:#E97A5C;
    --coral-soft:#F8CDB8;
    --mustard:#D9A93A;
    --mustard-soft:#F2DB97;
    --rule:#E9DEC5;
    --display:'Fraunces', Georgia, serif;
    --sans:'DM Sans', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;position:relative;overflow:hidden}
  body::before{content:"";position:absolute;top:-220px;right:-160px;width:520px;height:520px;border-radius:50%;background:radial-gradient(closest-side,var(--mustard-soft),transparent 70%);opacity:.6}
  body::after{content:"";position:absolute;bottom:-240px;left:-180px;width:560px;height:560px;border-radius:50%;background:radial-gradient(closest-side,var(--coral-soft),transparent 70%);opacity:.5}
  .wrap{max-width:560px;position:relative;z-index:1}
  .brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.5px;margin-bottom:48px;color:var(--ink);text-decoration:none}
  .brand .mark{width:34px;height:34px;border-radius:13px;background:linear-gradient(135deg,var(--coral) 0%,var(--mustard) 100%);position:relative;overflow:hidden}
  .brand .mark::before{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:var(--sage-soft);top:7px;left:7px;box-shadow:0 0 0 2px var(--bg-2)}
  .num{font-family:var(--display);font-weight:600;font-size:clamp(96px,18vw,180px);line-height:1;letter-spacing:-6px;background:linear-gradient(135deg,var(--coral) 0%,var(--mustard) 60%,var(--sage) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:20px}
  h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,4vw,46px);line-height:1.1;letter-spacing:-1px;margin-bottom:18px}
  h1 .accent{color:var(--coral);font-style:italic;font-weight:500}
  p{font-size:18px;color:var(--ink-soft);line-height:1.6;margin-bottom:36px;max-width:42ch;margin-left:auto;margin-right:auto}
  .cta{display:inline-flex;align-items:center;gap:8px;padding:15px 30px;border-radius:999px;font-size:14.5px;font-weight:600;background:var(--ink);color:var(--bg-2);text-decoration:none;transition:all .25s;box-shadow:0 8px 24px rgba(26,36,33,.18)}
  .cta:hover{background:var(--coral);transform:translateY(-1px);box-shadow:0 12px 28px rgba(233,122,92,.32)}
